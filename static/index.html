<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTrust One - Security Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            border-bottom: 1px solid #30363d;
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(10px);
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
        }
        .btn-primary {
            background-color: #238636;
            border-color: #238636;
        }
        .btn-primary:hover {
            background-color: #2ea043;
            border-color: #2ea043;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark px-4 py-3 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <span class="fs-4 fw-bold text-white">🛡️ ZeroTrust One</span>
            <span class="badge bg-secondary ms-2">v3.0</span>
        </div>
        <div>
            <button class="btn btn-outline-info btn-sm rounded-pill fw-semibold px-3">
                🧩 Download Extension
            </button>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="text-center mb-4">
                    <h1 class="fw-bold text-white mb-2">AI-Powered Cyber Defense</h1>
                    <p class="text-secondary">Analyze emails, URLs, text, and messages using Multi-LLM Consensus.</p>
                </div>

                <div class="card p-4 shadow-lg mb-4">
                    <div class="mb-3">
                        <label for="scanType" class="form-label text-secondary fw-semibold">Scan Type</label>
                        <select id="scanType" class="form-select bg-dark text-white border-secondary">
                            <option value="email">Email Content</option>
                            <option value="url">Web URL</option>
                            <option value="text">General Text Payload</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="scanInput" class="form-label text-secondary fw-semibold">Payload Content</label>
                        <textarea id="scanInput" class="form-control bg-dark text-white border-secondary" rows="5" placeholder="Paste suspicious message or link here..."></textarea>
                    </div>

                    <button onclick="runScan()" id="scanBtn" class="btn btn-primary btn-lg w-100 fw-bold">
                        🔍 Analyze Threat
                    </button>
                </div>

                <div id="resultCard" class="card p-4 d-none">
                    <h4 class="fw-bold text-white mb-3">Analysis Results</h4>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="text-secondary">Threat Level:</span>
                            <span id="threatLevel" class="fs-5 fw-bold ms-2"></span>
                        </div>
                        <div>
                            <span class="text-secondary">Risk Score:</span>
                            <span id="riskScore" class="fs-5 fw-bold text-warning ms-1">0/100</span>
                        </div>
                    </div>

                    <div class="p-3 bg-dark rounded border border-secondary mb-3">
                        <h6 class="text-secondary mb-1">Recommended Action</h6>
                        <p id="actionText" class="fw-semibold text-white mb-0">-</p>
                    </div>

                    <div class="p-3 bg-dark rounded border border-secondary">
                        <h6 class="text-secondary mb-1">Analyst Explanation</h6>
                        <p id="explanationText" class="text-light mb-0">-</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        async function runScan() {
            const scanType = document.getElementById("scanType").value;
            const content = document.getElementById("scanInput").value.trim();
            const scanBtn = document.getElementById("scanBtn");
            const resultCard = document.getElementById("resultCard");

            if (!content) {
                alert("Please paste some content to scan!");
                return;
            }

            scanBtn.disabled = true;
            scanBtn.innerText = "Scanning Payload...";

            try {
                const response = await fetch("/api/v1/scan", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ scan_type: scanType, content: content })
                });

                const data = await response.json();
                const analysis = data.analysis;

                document.getElementById("threatLevel").innerText = analysis.threat_level;
                document.getElementById("riskScore").innerText = analysis.risk_score + " / 100";
                document.getElementById("actionText").innerText = analysis.recommended_action;
                document.getElementById("explanationText").innerText = analysis.explanation;

                resultCard.classList.remove("d-none");
            } catch (err) {
                alert("Scan request failed.");
            } finally {
                scanBtn.disabled = false;
                scanBtn.innerText = "🔍 Analyze Threat";
            }
        }
    </script>
</body>
</html>
